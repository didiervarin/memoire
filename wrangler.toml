name = "memoire"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Fichiers du site (HTML, CSS, JS, icônes)
[assets]
directory = "./public"

# Base de données : remplace database_id par l'identifiant de ta base D1
# (Cloudflare > Storage & Databases > D1 > ta base > Database ID)
[[d1_databases]]
binding = "DB"
database_name = "memoire"
database_id = "fbdc92f9-fc7b-4489-a34c-fac6917b1599"

[observability]
enabled = true
